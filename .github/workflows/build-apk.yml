name: Build C2 Wake APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Generate Android project
        run: |
          npm install --no-save --legacy-peer-deps jszip tsx
          cat > gen.ts <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { generateAndroidProject } from './src/utils/androidProjectGenerator.ts';
          import { DEFAULT_CONFIG } from './src/types/config.ts';
          for (const f of generateAndroidProject(DEFAULT_CONFIG)) {
            const p = path.join('android-out', f.path);
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, f.content);
          }
          EOF
          npx tsx gen.ts
      - name: Build debug APK
        working-directory: android-out
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: C2Wake-APK
          path: android-out/app/build/outputs/apk/debug/app-debug.apk
